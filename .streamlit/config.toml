[theme]
base = "dark"
primaryColor = "#10B981"
backgroundColor = "#0B0F17"
secondaryBackgroundColor = "#131B2E"
textColor = "#F1F5F9"

[server]
# Keep a phone's session alive for 4 hours after its connection drops (screen locked, app in the background),
# so coming back picks up right where you left off instead of starting over. Streamlit's default is 2 minutes.
disconnectedSessionTTL = 14400
